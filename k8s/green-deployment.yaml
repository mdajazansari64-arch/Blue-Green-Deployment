
apiVersion: apps/v1
kind: Deployment

metadata:
  name: green-deployment
  namespace: blue-green

spec:
  replicas: 2

  selector:
    matchLabels:
      app: green

  template:
    metadata:
      labels:
        app: green

    spec:
      containers:
        - name: green-container
          image: ajazaj/green-app:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 80
